<!doctype html><meta charset="utf-8">
<!-- The app icon: a sticker in the shape of the play button, its top left corner peeled. The flap is the same shape
     mirrored across the fold line x + y = 58. Open with ?full (the square icon, default), ?round (cut to a circle)
     or ?fg (the Android adaptive foreground: the mark alone, inside the safe zone) and render at 1024 x 1024. -->
<style>html,body{margin:0;background:transparent}div{width:1024px;height:1024px;background:#fff1d2}svg{display:block;width:100%;height:100%}
.round{border-radius:50%}.fg{background:none}</style>
<div id="box"><svg id="svg" viewBox="2 -5 112 112">
  <defs><clipPath id="keep"><polygon points="158,-100 158,158 -100,158"/></clipPath></defs>
  <g filter="drop-shadow(0 2px 0 #493c5026) drop-shadow(0 0 .6px #493c5066)">
    <g clip-path="url(#keep)" stroke-linejoin="round">
      <polygon points="36,26 36,76 80,51" fill="#fff" stroke="#fff" stroke-width="30"/>
      <polygon points="36,26 36,76 80,51" fill="#ffa94d" stroke="#ffa94d" stroke-width="13"/>
    </g>
    <g clip-path="url(#keep)" stroke-linejoin="round">
      <polygon points="36,26 36,76 80,51" transform="matrix(0 -1 -1 0 58 58) translate(-1.5 -1.5)" fill="#493c50" opacity=".18" stroke="#493c50" stroke-width="30"/>
      <polygon points="36,26 36,76 80,51" transform="matrix(0 -1 -1 0 58 58)" fill="#efe4cb" stroke="#efe4cb" stroke-width="30"/>
    </g>
  </g>
</svg></div>
<script>
const m = location.search.slice(1);
if (m === 'round') { box.className = 'round'; svg.setAttribute('viewBox', '-8 -15 132 132'); }
if (m === 'fg') { box.className = 'fg'; svg.setAttribute('viewBox', '-25 -32 166 166'); }
</script>
